[project]
name = "minipy3dr"
version = "0.2.0"
description = "A small software 3D renderer for pygame surfaces."
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26",
    "pygame>=2.5",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
